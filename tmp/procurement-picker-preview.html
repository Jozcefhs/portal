<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Procurement checklist preview</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/procurement.css"><style>body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#eff5f9}main{max-width:1250px;margin:auto;background:white;padding:18px;border-radius:12px}.fixture-note{font-size:12px;color:#526779}output{display:block;white-space:pre-wrap;font-size:12px}</style></head><body><p class="fixture-note">LOCAL SYNTHETIC TEST — no live data, APIs or stock changes</p><main id="app"></main><output id="saved"></output><script src="/js/procurement.js"></script><script>
const names=['21g Needles','23g Needles','2ml Syringes','5ml Syringes','Aboniki','Accu-chek Strips','Amatem Softgel 20/120mg','Amatem Softgel 80/480mg','Amoxyl Capsule 250mg','Amoxyl Capsule 500mg','Antallerge Eyedrop','Ascorcx','Bandage','Bethamethazone Cream','Broncholyte Cough Syrup','Calamine Lotion','Caps Omeprazole','Chloramphenicol Eyedrop','Ciprofloxacin Eyedrop','Cotton Wool','Gloves'];
const items=Array.from({length:110},(_,i)=>({ItemId:'item-'+i,ItemName:names[i]||'Synthetic item '+(i+1),ItemCode:'TEST-'+(i+1),Unit:i<4?'pkts':'pcs',Quantity:i+2,Revision:1}));
const data={ok:true,capabilities:{canManage:true,canRequest:true,canConfigure:true},schoolSection:'Secondary',schoolSections:['Primary','Secondary'],settings:{Enabled:true},departments:[{Key:'clinic',Name:'Clinic'},{Key:'kitchen',Name:'Kitchen'}],items,departmentInventory:items.map(item=>({...item,InventoryId:'dept-'+item.ItemId,ProcurementItemId:item.ItemId,Department:'clinic',SchoolSection:'Secondary',Quantity:0})),requests:[],purchases:[],transfers:[]};
data.capabilities.canReviewRequests=true;
data.capabilities.canApprove=true;
data.capabilities.canReceive=true;
data.purchases=Array.from({length:6},(_,i)=>({PurchaseId:'TEST-PURCHASE-'+(i+1),SupplierName:'Test supplier',Reference:'TEST-SUPPLIER-REF-'+(i+1),CreatedAt:'2026-10-15T08:00:00Z',Status:i%2?'APPROVED':'PENDING',TotalAmount:10000,Lines:items.slice(i,i+2).map(item=>({ItemId:item.ItemId,ItemName:item.ItemName,Quantity:10,UnitCost:500}))}));
data.transfers=Array.from({length:6},(_,i)=>({TransferId:'TEST-TRANSFER-'+(i+1),Department:'clinic',SchoolSection:'Secondary',CanReceive:true,CreatedAt:'2026-10-15T09:00:00Z',Status:i%2?'PARTIALLY_RECEIVED':'IN_TRANSIT',Lines:items.slice(i,i+2).map(item=>({ItemId:item.ItemId,ItemName:item.ItemName,Quantity:10,ReceivedQuantity:i%2?5:0,ReturnedQuantity:0}))}));
data.requests=Array.from({length:8},(_,i)=>({RequisitionId:'TEST-REQUEST-'+(i+1),Department:'clinic',RequestedBy:'Test staff',CreatedAt:'2026-10-15T08:00:00Z',Status:i%2?'APPROVED':'PENDING',Lines:items.slice(i,i+(i%3)+1).map(item=>({ItemId:item.ItemId,ItemName:item.ItemName,Quantity:2}))}));
const requests=[];
window.DynamaxProcurement.mount(document.getElementById('app'),{branchId:'synthetic',department:'clinic',request:async(action,payload)=>{if(action==='list')return structuredClone(data);requests.push({action,payload});document.getElementById('saved').textContent=JSON.stringify({requests:requests.length,batchSizes:requests.map(row=>row.payload.Items?.length),uniqueItems:new Set(requests.flatMap(row=>(row.payload.Items||[]).map(item=>item.ItemId))).size},null,2);return{ok:true,summary:{Created:payload.Items?.length||0,Reused:payload.Items?.length||0},message:'Synthetic request accepted. No real stock was changed.'}}});
</script></body></html>
