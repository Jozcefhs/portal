name: School announcement delivery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: school-announcement-delivery
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Deliver scheduled announcements and queued push batches
        env:
          ENDPOINT: ${{ secrets.SCHOOL_NOTIFICATION_SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHOOL_NOTIFICATION_SCHEDULER_SECRET }}
        run: |
          test -n "$ENDPOINT"
          test -n "$SCHEDULER_SECRET"
          for attempt in $(seq 1 15); do
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors \
              -X POST "$ENDPOINT" \
              -H "Authorization: Bearer $SCHEDULER_SECRET" \
              -H "Content-Type: application/json" \
              --data '{"announcementsOnly":true,"pushJobLimit":1}'
          done
