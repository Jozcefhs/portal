<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procurement synthetic QA</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/procurement.css"><style>body{margin:0;padding:18px;background:#f4f7fb;font-family:Arial,sans-serif}#app{background:white;padding:20px;border:1px solid #ccdcea;border-radius:12px;max-width:1500px;margin:auto}.qa{font-size:12px;color:#5c7184;margin:0 auto 12px;max-width:1500px}</style><p class="qa">LOCAL SYNTHETIC QA — no live data or API. Submit buttons update only this browser fixture.</p><main id="app"></main><script src="../js/display-time.js"></script><script src="../js/procurement.js"></script><script>
