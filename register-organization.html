<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4bc8">
  <title>Register your organisation — Dynamax</title>
  <link rel="icon" href="images/Logo.png">
  <script src="js/preferences.js?v=20260726-biometric"></script>
<link rel="stylesheet" href="css/style.css?v=20260822-cbt-score-commit-finance-document-preview">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card organisation-registration-card">
      <header class="registration-brand"><img src="images/Logo.png" alt="Dynamax"><div><p class="eyebrow">Dynamax</p><h1>Register your organisation</h1><p>Choose the workspace and plan that fit your team.</p></div></header>
      <form id="organisationRegistrationForm" class="settings-fields two-column">
        <div class="settings-field"><label>Organisation name</label><input name="OrganisationName" required></div>
        <div class="settings-field"><label>Organisation type</label><select name="Edition" required><option value="school">School</option><option value="faith">Religious organisation</option><option value="organization">Other organisation</option></select></div>
        <div class="settings-field"><label>Contact name</label><input name="ContactName" required></div>
        <div class="settings-field"><label>Contact email</label><input name="Email" type="email" required></div>
        <div class="settings-field"><label>Phone</label><input name="Phone" required></div>
        <div class="settings-field"><label>Country</label><input name="Country" required></div>
        <div class="settings-field full-width plan-selection-section" id="plans">
          <div class="plan-selection-heading">
            <label>Plan</label>
            <fieldset class="billing-cycle-toggle" aria-label="Payment frequency">
              <label><input type="radio" name="BillingCycle" value="monthly" checked><span>Monthly</span></label>
              <label><input type="radio" name="BillingCycle" value="yearly"><span>Yearly</span></label>
            </fieldset>
          </div>
          <div class="plan-book-toolbar">
            <p class="plan-selection-help">Browse the pricing book and choose the plan that best fits your organisation.</p>
            <!--button type="button" id="downloadPricingBook" class="plan-book-download">Download pricing book (PDF)</button-->
          </div>
          <section class="plan-book-spread" aria-label="Pricing plan book">
            <p class="plan-mobile-hint">Swipe sideways to compare every plan.</p>
            <div class="plan-choice-grid" id="planChoiceGrid" aria-live="polite">
              <p class="muted">Loading current plans and pricing...</p>
            </div>
            <details class="plan-comparison-details" id="planComparisonDetails">
              <summary>Open all plan feature chapters</summary>
              <div class="plan-comparison-scroll" tabindex="0" aria-label="Plan feature comparison">
                <div class="plan-comparison-grid" id="planComparisonGrid"></div>
              </div>
            </details>
          </section>
        </div>
        <label class="inline-check full-width"><input type="checkbox" name="Consent" value="YES" required> I confirm that I am authorised to register this organisation.</label>
        <div class="registration-actions full-width"><button type="submit">Submit registration</button><a class="settings-link" href="index.html">Back to Dynamax</a></div>
        <p id="organisationRegistrationStatus" class="status full-width" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="js/site-config.js?v=20260809-branded-app-icon"></script>
  <script src="js/action-feedback.js?v=20260729-action-feedback"></script>
  <script src="js/payment-methods.js?v=20260809-platform-direct-transfer-sharp-text"></script>
  <script src="js/register-organization.js?v=20260809-platform-direct-transfer"></script>
</body>
</html>
