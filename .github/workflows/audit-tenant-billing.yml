name: Audit tenant project billing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
      DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
      DYNAMAX_GCP_BILLING_ACCOUNT: ${{ vars.DYNAMAX_GCP_BILLING_ACCOUNT }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Check every registered tenant project
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DYNAMAX_TENANT_PROVISIONER_SECRET}" ]] || { echo 'The pool read secret is missing.' >&2; exit 1; }
          [[ -n "${DYNAMAX_GCP_BILLING_ACCOUNT}" ]] || { echo 'The target billing account is missing.' >&2; exit 1; }
          payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" '{password:$password,action:"load"}')"
          inventory="$(curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${payload}")"
          token="$(gcloud auth print-access-token)"
          target="billingAccounts/${DYNAMAX_GCP_BILLING_ACCOUNT}"
          ready_unbilled=0
          ready_unknown=0
          {
            echo '### Tenant billing audit (read-only)'
            echo '| Google project | Edition | Pool status | Billing status |'
            echo '| --- | --- | --- | --- |'
            while IFS=$'\t' read -r project_id edition pool_status; do
              [[ "${project_id}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || continue
              if billing_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${token}" \
                "https://cloudbilling.googleapis.com/v1/projects/${project_id}/billingInfo" 2>/dev/null)"; then
                billing_enabled="$(jq -r '.billingEnabled // false' <<<"${billing_json}")"
                billing_name="$(jq -r '.billingAccountName // ""' <<<"${billing_json}")"
                if [[ "${billing_enabled}" == 'true' && "${billing_name}" == "${target}" ]]; then
                  billing_status='BLAZE — configured account'
                elif [[ "${billing_enabled}" == 'true' ]]; then
                  billing_status='BLAZE — another account'
                else
                  billing_status='UNBILLED'
                  if [[ "${pool_status,,}" == 'ready' ]]; then ready_unbilled=$((ready_unbilled + 1)); fi
                fi
              else
                billing_status='UNKNOWN — access denied or API error'
                if [[ "${pool_status,,}" == 'ready' ]]; then ready_unknown=$((ready_unknown + 1)); fi
              fi
              printf '| `%s` | %s | %s | %s |\n' "${project_id}" "${edition}" "${pool_status}" "${billing_status}"
            done < <(jq -r '.slots[]? | [.FirebaseProjectId, .Edition, .Status] | @tsv' <<<"${inventory}")
            echo
            printf 'Unbilled Ready projects: %s. Ready projects with unknown billing: %s.\n' "${ready_unbilled}" "${ready_unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"
