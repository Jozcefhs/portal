name: Notification reminders

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYY-MM-DD processing date
        required: false
        type: string

jobs:
  prepare:
    name: Load school scheduler targets
    runs-on: ubuntu-latest
    outputs:
      organisations: ${{ steps.matrix.outputs.organisations }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build enabled school matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          organisations="$(node scripts/organisation-deployment-matrix.mjs --target all)"
          schools="$(printf '%s' "$organisations" | jq -c '[.[] | select(.edition == "school")]')"
          echo "organisations=${schools}" >> "${GITHUB_OUTPUT}"

  process:
    name: ${{ matrix.organisation.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ matrix.organisation.githubEnvironment }}
      url: https://${{ matrix.organisation.cloudflareProject }}.pages.dev
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        organisation: ${{ fromJSON(needs.prepare.outputs.organisations) }}
    concurrency:
      group: notification-reminders-${{ matrix.organisation.id }}
      cancel-in-progress: false
    env:
      ENDPOINT: https://${{ matrix.organisation.cloudflareProject }}.pages.dev/api/notification-scheduler
      EXPECTED_WORKSPACE_ID: ${{ matrix.organisation.workspaceId }}
      EXPECTED_EDITION: ${{ matrix.organisation.edition }}
      SCHEDULER_SECRET: ${{ secrets.NOTIFICATION_SCHEDULER_SECRET }}
      PROCESS_DATE: ${{ inputs.date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Process school-fee credits
        env:
          SCHEDULER_MODE: credits
        run: node scripts/run-daily-notifications.mjs
      - name: Process fee reminders
        env:
          SCHEDULER_MODE: reminders
        run: node scripts/run-daily-notifications.mjs
      - name: Process remaining daily notifications
        env:
          SCHEDULER_MODE: maintenance
        run: node scripts/run-daily-notifications.mjs
