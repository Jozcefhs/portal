name: Attendance presence notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  prepare:
    name: Load school scheduler targets
    runs-on: ubuntu-latest
    outputs:
      organisations: ${{ steps.matrix.outputs.organisations }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build enabled school matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          organisations="$(node scripts/organisation-deployment-matrix.mjs --target all)"
          schools="$(printf '%s' "$organisations" | jq -c '[.[] | select(.edition == "school")]')"
          echo "organisations=${schools}" >> "${GITHUB_OUTPUT}"

  process:
    name: ${{ matrix.organisation.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ matrix.organisation.githubEnvironment }}
      url: https://${{ matrix.organisation.cloudflareProject }}.pages.dev
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        organisation: ${{ fromJSON(needs.prepare.outputs.organisations) }}
    concurrency:
      group: attendance-presence-notifications-${{ matrix.organisation.id }}
      cancel-in-progress: false
    steps:
      - name: Notify staff of due presence checks
        shell: bash
        env:
          ENDPOINT: https://${{ matrix.organisation.cloudflareProject }}.pages.dev/api/notification-scheduler
          EXPECTED_WORKSPACE_ID: ${{ matrix.organisation.workspaceId }}
          EXPECTED_EDITION: ${{ matrix.organisation.edition }}
          SCHEDULER_SECRET: ${{ secrets.NOTIFICATION_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SCHEDULER_SECRET"
          payload="$(jq -nc \
            --arg workspace "$EXPECTED_WORKSPACE_ID" \
            --arg edition "$EXPECTED_EDITION" \
            '{attendanceOnly:true,attendanceLimit:10,expectedWorkspaceId:$workspace,expectedEdition:$edition}')"
          for attempt in $(seq 1 5); do
            response="$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors \
              -X POST "$ENDPOINT" \
              -H "Authorization: Bearer $SCHEDULER_SECRET" \
              -H "Content-Type: application/json" \
              --data "$payload")"
            printf '%s\n' "$response"
            printf '%s' "$response" | jq -e \
              --arg workspace "${EXPECTED_WORKSPACE_ID,,}" \
              --arg edition "${EXPECTED_EDITION,,}" \
              '.ok == true and (.workspaceId | ascii_downcase) == $workspace and (.edition | ascii_downcase) == $edition' >/dev/null
            eligible="$(printf '%s' "$response" | jq -r '.attendancePresence.eligible // 0')"
            retry_backlog="$(printf '%s' "$response" | jq -r '.pushRetries.inspected // 0')"
            if [[ "$eligible" -lt 10 && "$retry_backlog" -lt 50 ]]; then
              break
            fi
          done
