name: Clean up non-core subscribed tenants

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Permanently delete non-core subscriber projects and central subscription records
        required: true
        default: false
        type: boolean
      confirmation:
        description: For apply mode, enter DELETE ALL NONCORE SUBSCRIBERS
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamax-noncore-subscriber-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Preview or clean non-core subscribers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TENANT_SUBSCRIBER_CLEANUP_APPLY: ${{ inputs.apply || false }}
      TENANT_SUBSCRIBER_CLEANUP_CONFIRMATION: ${{ inputs.confirmation || '' }}
      DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
      DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        if: ${{ inputs.apply == true }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: ${{ inputs.apply == true }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Preview or apply tenant cleanup
        run: node scripts/cleanup-subscribed-tenants.mjs

      - name: Summarize cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f tenant-subscriber-cleanup-result.json ]]; then
            {
              echo '### Non-core subscriber cleanup'
              echo ''
              echo '```json'
              cat tenant-subscriber-cleanup-result.json
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload cleanup report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenant-subscriber-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: tenant-subscriber-cleanup-result.json
          if-no-files-found: error
          retention-days: 30
