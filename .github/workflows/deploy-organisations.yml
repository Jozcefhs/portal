name: Deploy organisations

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      organisation:
        description: Organisation id from deploy/organisations.json, or all
        required: true
        default: all
        type: string

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  validate:
    name: Validate organisation registry
    runs-on: ubuntu-latest
    outputs:
      organisations: ${{ steps.matrix.outputs.organisations }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate registry and deployment tests
        run: |
          node scripts/organisation-deployment-matrix.mjs --validate-only
          node --test tests/deployment-workflows.test.mjs

      - name: Build deployment matrix
        id: matrix
        shell: bash
        env:
          TARGET_ORGANISATION: ${{ inputs.organisation || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
          DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            organisations="$(node scripts/organisation-deployment-matrix.mjs --target "${TARGET_ORGANISATION}")"
          elif [[ "${EVENT_NAME}" == "schedule" ]]; then
            organisations="$(node scripts/managed-organisation-deployment-matrix.mjs --target all --pending-only)"
          else
            organisations="$(node scripts/managed-organisation-deployment-matrix.mjs --target "${TARGET_ORGANISATION}")"
          fi
          echo "organisations=${organisations}" >> "${GITHUB_OUTPUT}"
          echo "count=$(jq 'length' <<<"${organisations}")" >> "${GITHUB_OUTPUT}"

  deploy:
    name: ${{ matrix.organisation.name }}
    needs: validate
    if: ${{ needs.validate.outputs.count != '0' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.MULTI_ORG_DEPLOY_ENABLED == 'true') }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        organisation: ${{ fromJSON(needs.validate.outputs.organisations) }}
    uses: ./.github/workflows/deploy-organisation.yml
    with:
      organisation_id: ${{ matrix.organisation.id }}
      organisation_name: ${{ matrix.organisation.name }}
      edition: ${{ matrix.organisation.edition }}
      workspace_id: ${{ matrix.organisation.workspaceId }}
      github_environment: ${{ matrix.organisation.githubEnvironment }}
      firebase_config: ${{ matrix.organisation.firebaseConfig }}
      cloudflare_account_id: ${{ matrix.organisation.cloudflareAccountId }}
      cloudflare_project: ${{ matrix.organisation.cloudflareProject }}
      platform_url: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
      paystack_deployment_requested_at: ${{ matrix.organisation.paystackDeploymentRequestedAt || '' }}
      email_deployment_requested_at: ${{ matrix.organisation.emailDeploymentRequestedAt || '' }}
      email_deployment_provider: ${{ matrix.organisation.emailDeploymentProvider || '' }}
    secrets: inherit
