name: Publish verified desktop 3.1.74 installer
on:
  push:
    branches: [codex/publish-desktop-3174]
    paths: [.github/workflows/publish-desktop-3174.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify installer and publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Jozcefhs/portal
        shell: bash
        run: |
          set -euo pipefail
          installer=Dynamax_Setup_v3.1.74.exe
          digest=688da7c868e707489dfa0508a18f1ec71f03edb4feaa7a174f1170ed93105842
          for part in 1 2; do
            curl --fail --retry 3 --silent --show-error "https://c6bc6284.destinychristianacademy.pages.dev/installer-$part.bin" >> "$installer" || exit 1
          done
          echo "$digest  $installer" | sha256sum -c -
          gh release view desktop-stable --json isDraft,name | jq -e '.isDraft == false and (.name | test("v3\\.1\\.7[34] "))'
          if ! gh release view desktop-stable --json assets | jq -e --arg name "$installer" '.assets | any(.name == $name)'; then
            gh release upload desktop-stable "$installer"
          fi
          gh release view desktop-stable --json assets | jq -e --arg name "$installer" --arg digest "sha256:$digest" '.assets | any(.name == $name and .digest == $digest and .size == 42772978)'
          mkdir verification
          gh release download desktop-stable --pattern "$installer" --dir verification
          (cd verification && echo "$digest  $installer" | sha256sum -c -)
          printf '%s\n' 'Student accounts highlights selected pupils in blue with white text. Click a selected pupil to deselect just that pupil. Double-click opens the ledger.' '' '[Download Dynamax Desktop 3.1.74](https://github.com/Jozcefhs/portal/releases/download/desktop-stable/Dynamax_Setup_v3.1.74.exe)' '' "Installer SHA-256: $digest" > release-notes.md
          gh release edit desktop-stable --title 'Dynamax Desktop v3.1.74 - Stable Download' --notes-file release-notes.md
