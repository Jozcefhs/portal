name: Provision Dynamax tenant pool

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the next provisioning plan without creating billable resources
        required: true
        default: true
        type: boolean
      edition:
        description: Edition for an exact manually named project
        required: false
        default: organization
        type: choice
        options:
          - school
          - faith
          - organization
      project_id:
        description: Optional exact Firebase and Cloudflare project ID
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamax-tenant-pool-provisioner
  cancel-in-progress: false

jobs:
  provision:
    name: Provision next queued tenant project request
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TENANT_POOL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
      DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
      DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
      DYNAMAX_GCP_BILLING_ACCOUNT: ${{ vars.DYNAMAX_GCP_BILLING_ACCOUNT }}
      DYNAMAX_GCP_BILLING_REQUIRED: ${{ vars.DYNAMAX_GCP_BILLING_REQUIRED || 'true' }}
      DYNAMAX_GCP_PARENT: ${{ vars.DYNAMAX_GCP_PARENT }}
      DYNAMAX_PROVISION_PROJECT_ID: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
      DYNAMAX_TENANT_REGION: ${{ vars.DYNAMAX_TENANT_REGION || 'africa-south1' }}
      DYNAMAX_TENANT_PROJECT_PREFIX: ${{ vars.DYNAMAX_TENANT_PROJECT_PREFIX || 'dynamax-tenant' }}
      MANUAL_TENANT_EDITION: ${{ inputs.edition || '' }}
      MANUAL_TENANT_PROJECT_ID: ${{ inputs.project_id || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate tenant queue access
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${DYNAMAX_TENANT_PROVISIONER_SECRET}" ]] || missing+=("DYNAMAX_TENANT_PROVISIONER_SECRET secret")
          if [[ -n "${MANUAL_TENANT_PROJECT_ID}" ]]; then
            [[ "${MANUAL_TENANT_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || missing+=("valid project_id input")
            [[ "${MANUAL_TENANT_EDITION}" =~ ^(school|faith|organization)$ ]] || missing+=("valid edition input")
          fi
          if (( ${#missing[@]} )); then
            printf '::error::Missing tenant queue configuration: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Inspect next provisioning request
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_TENANT_PROJECT_ID}" ]]; then
            request="$(jq -nc --arg reference "PRECHECK-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --arg edition "${MANUAL_TENANT_EDITION}" --arg project_id "${MANUAL_TENANT_PROJECT_ID}" '{Reference:$reference,Edition:$edition,Mode:"branded",Count:1,RequestedProjectId:$project_id,Status:"Pending",RequestedBy:"GitHub exact-project preflight"}')"
            response='{}'
          else
            payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" '{password:$password,action:"load"}')"
            response="$(curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${payload}")"
            request="$(jq -c '[.requests[] | select((.Status | ascii_downcase) == "pending" and .ActionRequired == true) | .Count = (.EffectiveCount // .Count)] | sort_by(.RequestedAt) | .[0] // empty' <<<"${response}")"
          fi
          if [[ -z "${request}" || "${request}" == "null" ]]; then
            echo 'has_request=false' >> "${GITHUB_OUTPUT}"
            echo 'No tenant project request is waiting; no infrastructure validation or provisioning was needed.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo 'has_request=true' >> "${GITHUB_OUTPUT}"
          printf 'request_base64=%s\n' "$(printf '%s' "${request}" | base64 -w 0)" >> "${GITHUB_OUTPUT}"
          printf 'reference=%s\n' "$(jq -r '.Reference' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'edition=%s\n' "$(jq -r '.Edition' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'count=%s\n' "$(jq -r '.Count' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'requested_project_id=%s\n' "$(jq -r '.RequestedProjectId // empty' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'precreated_ids_base64=%s\n' "$(jq -c '.policy.PrecreatedProjectIds // []' <<<"${response}" | base64 -w 0)" >> "${GITHUB_OUTPUT}"
          printf 'registered_ids_base64=%s\n' "$(jq -c '[.slots[]?.FirebaseProjectId | select(length > 0)]' <<<"${response}" | base64 -w 0)" >> "${GITHUB_OUTPUT}"

      - name: Validate provisioning infrastructure
        if: ${{ steps.inspect.outputs.has_request == 'true' && env.APPLY_CHANGES == 'true' }}
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DYNAMAX_PROVISION_SERVICE_ACCOUNT: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}
          DYNAMAX_PROVISION_PROJECT_ID: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID variable")
          [[ -n "${CLOUDFLARE_API_TOKEN}" ]] || missing+=("CLOUDFLARE_API_TOKEN secret")
          if [[ "${DYNAMAX_GCP_BILLING_REQUIRED}" != "false" ]]; then
            [[ -n "${DYNAMAX_GCP_BILLING_ACCOUNT}" ]] || missing+=("DYNAMAX_GCP_BILLING_ACCOUNT variable")
          fi
          [[ -n "${GCP_WIF_PROVIDER}" ]] || missing+=("GCP_WIF_PROVIDER variable")
          [[ -n "${DYNAMAX_PROVISION_SERVICE_ACCOUNT}" ]] || missing+=("DYNAMAX_PROVISION_SERVICE_ACCOUNT variable")
          [[ -n "${DYNAMAX_PROVISION_PROJECT_ID}" ]] || missing+=("DYNAMAX_PROVISION_PROJECT_ID variable")
          if (( ${#missing[@]} )); then
            printf '::error::A tenant is waiting, but provisioning infrastructure is incomplete: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ steps.inspect.outputs.has_request == 'true' && env.APPLY_CHANGES == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: ${{ steps.inspect.outputs.has_request == 'true' && env.APPLY_CHANGES == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve Google Cloud project parent
        if: ${{ steps.inspect.outputs.has_request == 'true' && env.APPLY_CHANGES == 'true' }}
        shell: bash
        env:
          TARGET_TENANT_PROJECT_ID: ${{ steps.inspect.outputs.requested_project_id }}
          REQUESTED_PROJECT_COUNT: ${{ steps.inspect.outputs.count }}
          PRECREATED_IDS_BASE64: ${{ steps.inspect.outputs.precreated_ids_base64 }}
          REGISTERED_IDS_BASE64: ${{ steps.inspect.outputs.registered_ids_base64 }}
        run: |
          set -euo pipefail
          if [[ -n "${TARGET_TENANT_PROJECT_ID}" ]] && gcloud projects describe "${TARGET_TENANT_PROJECT_ID}" --format='value(projectId)' >/dev/null 2>&1; then
            echo "Using pre-created Google Cloud project ${TARGET_TENANT_PROJECT_ID}; no project parent is required." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          parent="${DYNAMAX_GCP_PARENT}"
          if [[ -z "${parent}" ]]; then
            parent_json="$(gcloud projects describe "${DYNAMAX_PROVISION_PROJECT_ID}" --format='json(parent)')"
            parent_type="$(jq -r '.parent.type // empty' <<<"${parent_json}")"
            parent_id="$(jq -r '.parent.id // empty' <<<"${parent_json}")"
            case "${parent_type}" in
              organization) parent="organizations/${parent_id}" ;;
              folder) parent="folders/${parent_id}" ;;
            esac
          fi
          if [[ -z "${parent}" ]]; then
            mapfile -t accessible_organisations < <(gcloud organizations list --format='value(name)' 2>/dev/null | sed '/^[[:space:]]*$/d' || true)
            if (( ${#accessible_organisations[@]} == 1 )); then
              parent="${accessible_organisations[0]}"
              echo "Automatically discovered Google Cloud parent ${parent}." >> "${GITHUB_STEP_SUMMARY}"
            fi
          fi
          if [[ -z "${parent}" ]]; then
            precreated_json="$(printf '%s' "${PRECREATED_IDS_BASE64}" | base64 --decode)"
            registered_json="$(printf '%s' "${REGISTERED_IDS_BASE64}" | base64 --decode)"
            required_count="$((REQUESTED_PROJECT_COUNT + 0))"
            selected_projects=()
            while IFS= read -r project_id; do
              [[ "${project_id}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || continue
              if jq -e --arg project_id "${project_id}" 'index($project_id) != null' <<<"${registered_json}" >/dev/null; then
                continue
              fi
              if gcloud projects describe "${project_id}" --format='value(projectId)' >/dev/null 2>&1; then
                selected_projects+=("${project_id}")
              fi
              (( ${#selected_projects[@]} >= required_count )) && break
            done < <(jq -r '.[]' <<<"${precreated_json}")
            if (( ${#selected_projects[@]} >= required_count )); then
              selected_csv="$(IFS=,; echo "${selected_projects[*]}")"
              echo "DYNAMAX_PRECREATED_PROJECT_IDS=${selected_csv}" >> "${GITHUB_ENV}"
              echo "Using ${#selected_projects[@]} explicitly approved, pre-created Google Cloud project(s): ${selected_csv}." >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi
          if [[ ! "${parent}" =~ ^(organizations|folders)/[0-9]+$ ]]; then
            echo '::error::A tenant is waiting, but no Google Cloud project source is available. Set DYNAMAX_GCP_PARENT to organizations/NUMBER or folders/NUMBER, or add enough unused project IDs under Plans and pricing -> Ready project pool -> Pool settings.'
            exit 1
          fi
          echo "DYNAMAX_GCP_PARENT=${parent}" >> "${GITHUB_ENV}"
          echo "Using Google Cloud project parent ${parent}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Claim next provisioning request
        id: claim
        if: ${{ steps.inspect.outputs.has_request == 'true' }}
        shell: bash
        env:
          INSPECTED_REFERENCE: ${{ steps.inspect.outputs.reference }}
          INSPECTED_REQUEST_BASE64: ${{ steps.inspect.outputs.request_base64 }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_TENANT_PROJECT_ID}" ]]; then
            if [[ "${APPLY_CHANGES}" == "true" ]]; then
              queue_payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" --arg edition "${MANUAL_TENANT_EDITION}" --arg project_id "${MANUAL_TENANT_PROJECT_ID}" '{password:$password,action:"request",request:{Edition:$edition,Mode:"branded",Count:1,RequestedProjectId:$project_id,RequestedBy:"GitHub exact-project provisioner"}}')"
              queue_response="$(curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${queue_payload}")"
              target_reference="$(jq -r '.request.Reference' <<<"${queue_response}")"
              payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" --arg runner "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --arg reference "${target_reference}" '{password:$password,action:"claim-next",runnerId:$runner,reference:$reference}')"
              response="$(curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${payload}")"
              request="$(jq -c '.request // empty' <<<"${response}")"
            else
              request="$(jq -nc --arg reference "DRYRUN-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --arg edition "${MANUAL_TENANT_EDITION}" --arg project_id "${MANUAL_TENANT_PROJECT_ID}" '{Reference:$reference,Edition:$edition,Mode:"branded",Count:1,RequestedProjectId:$project_id,Status:"Pending",RequestedBy:"GitHub exact-project dry run"}')"
            fi
          elif [[ "${APPLY_CHANGES}" == "true" ]]; then
            payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" --arg runner "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --arg reference "${INSPECTED_REFERENCE}" '{password:$password,action:"claim-next",runnerId:$runner,reference:$reference}')"
            response="$(curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${payload}")"
            request="$(jq -c '.request // empty' <<<"${response}")"
          else
            request="$(printf '%s' "${INSPECTED_REQUEST_BASE64}" | base64 --decode)"
          fi
          if [[ -z "${request}" || "${request}" == "null" ]]; then
            echo 'has_request=false' >> "${GITHUB_OUTPUT}"
            echo 'No tenant project request is waiting.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo 'has_request=true' >> "${GITHUB_OUTPUT}"
          printf 'request_base64=%s\n' "$(printf '%s' "${request}" | base64 -w 0)" >> "${GITHUB_OUTPUT}"
          printf 'reference=%s\n' "$(jq -r '.Reference' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'edition=%s\n' "$(jq -r '.Edition' <<<"${request}")" >> "${GITHUB_OUTPUT}"
          printf 'count=%s\n' "$(jq -r '.Count' <<<"${request}")" >> "${GITHUB_OUTPUT}"

      - name: Use Node.js 22
        if: ${{ steps.claim.outputs.has_request == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        if: ${{ steps.claim.outputs.has_request == 'true' && env.APPLY_CHANGES == 'true' }}
        run: npm ci --ignore-scripts --omit=dev

      - name: Provision isolated Firebase and Cloudflare projects
        id: provision
        if: ${{ steps.claim.outputs.has_request == 'true' }}
        env:
          TENANT_PROVISION_APPLY: ${{ env.APPLY_CHANGES }}
          TENANT_PROVISIONING_REQUEST_BASE64: ${{ steps.claim.outputs.request_base64 }}
        run: node scripts/provision-tenant-projects.mjs

      - name: Mark interrupted request failed
        if: ${{ failure() && env.APPLY_CHANGES == 'true' && steps.claim.outputs.has_request == 'true' }}
        shell: bash
        run: |
          payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" --arg reference '${{ steps.claim.outputs.reference }}' '{password:$password,action:"finish-request",request:{Reference:$reference,Status:"Failed",LastError:"The GitHub provisioning run was interrupted. Review the workflow log."}}')"
          curl --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" -H 'Content-Type: application/json' --data "${payload}" || true

      - name: Summarize provisioning
        if: ${{ always() && steps.claim.outputs.has_request == 'true' }}
        env:
          SUMMARY_PROJECT_ID: ${{ inputs.project_id || 'queued request' }}
        shell: bash
        run: |
          {
            echo '### Tenant project pool'
            echo ''
            echo '- Request: `${{ steps.claim.outputs.reference }}`'
            echo '- Edition: `${{ steps.claim.outputs.edition }}`'
            echo '- Project count: `${{ steps.claim.outputs.count }}`'
            echo "- Exact project ID: \`${SUMMARY_PROJECT_ID}\`"
            echo '- Apply changes: `${{ env.APPLY_CHANGES }}`'
            if [[ -f tenant-provision-result.json ]]; then
              echo ''
              echo '```json'
              cat tenant-provision-result.json
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
