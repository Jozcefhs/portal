<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Attendance groups local QA</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px Arial;background:#e9eef4;margin:16px;color:#17314b}button{padding:10px;margin:4px}iframe{height:900px;width:1100px;max-width:100%;border:1px solid #a5bbcd;background:white}p{margin:8px 0}</style></head><body><h1>Attendance groups · local synthetic QA</h1><p>No live records or requests. Change the embedded viewport to test responsive layout.</p><nav><button data-width="1100">Desktop 1100px</button><button data-width="820">Tablet landscape 820px</button><button data-width="390">Mobile 390px</button></nav><p id="width">Viewport 1100px</p><iframe title="Attendance groups test viewport" src="content.html"></iframe><script>document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').style.width=`${button.dataset.width}px`;document.getElementById('width').textContent=`Viewport ${button.dataset.width}px`;}));</script></body></html>
