name: Recover approved held tenant billing

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Link the two newer projects and release the seven verified billing holds
        required: true
        default: false
        type: boolean
      console_verified_legacy:
        description: Confirm 002, 003, 004, 007 and 009 are linked to 01DFE6-C94543-13DEC6 in Google console
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamax-tenant-pool-provisioner
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamax.cc' }}
      DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
      DYNAMAX_GCP_BILLING_ACCOUNT: ${{ vars.DYNAMAX_GCP_BILLING_ACCOUNT }}
      RECOVERY_APPLY: ${{ inputs.apply }}
      CONSOLE_VERIFIED_LEGACY: ${{ inputs.console_verified_legacy }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate recovery safeguards
        run: node --test tests/held-tenant-billing-recovery.test.mjs
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Recover only approved, verified billing holds
        run: node scripts/recover-held-tenant-billing.mjs
