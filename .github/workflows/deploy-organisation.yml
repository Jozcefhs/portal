name: Deploy one organisation

on:
  workflow_call:
    inputs:
      organisation_id:
        description: Stable organisation key from deploy/organisations.json
        required: true
        type: string
      organisation_name:
        description: Human-readable organisation name
        required: true
        type: string
      edition:
        description: Deployment-bound organisation edition
        required: true
        type: string
      workspace_id:
        description: Deployment-bound workspace identity
        required: true
        type: string
      github_environment:
        description: GitHub environment holding organisation deployment configuration
        required: true
        type: string
      firebase_config:
        description: Edition-specific Firebase CLI configuration file
        required: true
        type: string
      cloudflare_project:
        description: Cloudflare Pages project name
        required: true
        type: string
      cloudflare_account_id:
        description: Cloudflare account containing the Pages project
        required: true
        type: string
      platform_url:
        description: Central Dynamax platform URL
        required: true
        type: string
      paystack_deployment_requested_at:
        description: Exact queued Paystack deployment timestamp, when applicable
        required: false
        default: ''
        type: string
      email_deployment_requested_at:
        description: Exact queued email-provider deployment timestamp, when applicable
        required: false
        default: ''
        type: string
      email_deployment_provider:
        description: Target queued email provider, when applicable
        required: false
        default: ''
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare token allowed to deploy Pages projects
        required: true
      DYNAMAX_TENANT_PROVISIONER_SECRET:
        description: Provisioner credential used only to complete queued payment deployments
        required: false

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.organisation_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.github_environment }}
      url: https://${{ inputs.cloudflare_project }}.pages.dev
    concurrency:
      group: deploy-${{ inputs.organisation_id }}-production
      cancel-in-progress: true
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_INDEX_SERVICE_ACCOUNT: ${{ vars.GCP_INDEX_SERVICE_ACCOUNT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
      FIREBASE_CONFIG: ${{ inputs.firebase_config }}
      EXPECTED_EDITION: ${{ inputs.edition }}
      EXPECTED_WORKSPACE_ID: ${{ inputs.workspace_id }}
      NOTIFICATION_SCHEDULER_SECRET: ${{ secrets.NOTIFICATION_SCHEDULER_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate organisation deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${FIREBASE_PROJECT_ID}" ]] || missing+=("Firebase project ID")
          [[ -n "${GCP_WIF_PROVIDER}" ]] || missing+=("Workload Identity provider")
          [[ -n "${GCP_INDEX_SERVICE_ACCOUNT}" ]] || missing+=("index service account")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || missing+=("Cloudflare account ID")
          [[ -n "${NOTIFICATION_SCHEDULER_SECRET}" ]] || missing+=("notification scheduler secret")
          if (( ${#missing[@]} )); then
            printf '::error::GitHub environment %s is missing: %s\n' \
              '${{ inputs.github_environment }}' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          node -e "const fs=require('node:fs'); const config=JSON.parse(fs.readFileSync(process.env.FIREBASE_CONFIG,'utf8')); const firestore=Array.isArray(config.firestore)?config.firestore[0]:config.firestore; if(!firestore?.indexes) throw new Error('Firebase configuration has no Firestore index file.'); JSON.parse(fs.readFileSync(firestore.indexes,'utf8'));"

      - name: Detect required Firestore index deployment
        id: firestore_indexes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          should_deploy=false
          index_file="$(node -e "const fs=require('node:fs'); const config=JSON.parse(fs.readFileSync(process.env.FIREBASE_CONFIG,'utf8')); const firestore=Array.isArray(config.firestore)?config.firestore[0]:config.firestore; process.stdout.write(firestore.indexes);")"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_deploy=true
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
              if ! git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- "${FIREBASE_CONFIG}" "${index_file}"; then
                should_deploy=true
              else
                echo "Firestore index definitions are unchanged; continuing directly to the application deployment."
              fi
            else
              should_deploy=true
            fi
          else
            echo "Scheduled application deployment is reusing the project's existing Firestore index profile."
          fi
          echo "should_deploy=${should_deploy}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud
        if: ${{ steps.firestore_indexes.outputs.should_deploy == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_INDEX_SERVICE_ACCOUNT }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply required Firestore indexes
        if: ${{ steps.firestore_indexes.outputs.should_deploy == 'true' }}
        shell: bash
        run: >-
          npx --yes firebase-tools@15.30.2 deploy
          --only firestore:indexes
          --project "${FIREBASE_PROJECT_ID}"
          --config "${FIREBASE_CONFIG}"
          --force
          --non-interactive

      - name: Install function dependencies
        run: npm ci --ignore-scripts --omit=dev

      - name: Synchronize the environment scheduler secret to Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT: ${{ inputs.cloudflare_project }}
        run: |
          set -euo pipefail
          umask 077
          secret_file="$(mktemp)"
          cleanup() { rm -f "${secret_file}"; }
          trap cleanup EXIT
          SECRET_FILE="${secret_file}" node -e 'const fs = require("node:fs"); fs.writeFileSync(process.env.SECRET_FILE, JSON.stringify({ NOTIFICATION_SCHEDULER_SECRET: process.env.NOTIFICATION_SCHEDULER_SECRET }), { mode: 0o600 });'
          npx --yes wrangler@4.125.0 pages secret bulk "${secret_file}" --project-name "${CLOUDFLARE_PROJECT}"

      - name: Ensure workspace-isolated Cloudflare R2 storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT: ${{ inputs.cloudflare_project }}
        run: node scripts/ensure-r2-storage.mjs --project "${CLOUDFLARE_PROJECT}"

      - name: Prepare production files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-deploy
          mkdir .pages-deploy
          cp -R css functions images js vendor .pages-deploy/
          cp _headers _routes.json .pages-deploy/
          cp ./*.html .pages-deploy/
          cp app-icon.svg manifest.webmanifest sw.js version.json .pages-deploy/

      - name: Deploy Cloudflare Pages production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.125.0"
          command: pages deploy .pages-deploy --project-name=${{ inputs.cloudflare_project }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed organisation identity
        run: >-
          node scripts/verify-organisation-deployment.mjs
          --url "https://${{ inputs.cloudflare_project }}.pages.dev"
          --workspace "${EXPECTED_WORKSPACE_ID}"
          --edition "${EXPECTED_EDITION}"

      - name: Mark managed Paystack deployment complete
        if: ${{ inputs.paystack_deployment_requested_at != '' }}
        env:
          DYNAMAX_PLATFORM_URL: ${{ inputs.platform_url }}
          DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
          CLOUDFLARE_PROJECT: ${{ inputs.cloudflare_project }}
          PAYSTACK_DEPLOYMENT_REQUESTED_AT: ${{ inputs.paystack_deployment_requested_at }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DYNAMAX_TENANT_PROVISIONER_SECRET}" ]] || { echo '::error::DYNAMAX_TENANT_PROVISIONER_SECRET is required.'; exit 1; }
          payload="$(jq -nc \
            --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" \
            --arg projectId "${CLOUDFLARE_PROJECT}" \
            --arg requestedAt "${PAYSTACK_DEPLOYMENT_REQUESTED_AT}" \
            '{password:$password,action:"complete-managed-paystack-deployment",projectId:$projectId,requestedAt:$requestedAt}')"
          curl --fail-with-body --silent --show-error \
            "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" \
            -H 'Content-Type: application/json' \
            --data "${payload}"

      - name: Mark managed email-provider deployment complete
        if: ${{ inputs.email_deployment_requested_at != '' }}
        env:
          DYNAMAX_PLATFORM_URL: ${{ inputs.platform_url }}
          DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
          CLOUDFLARE_PROJECT: ${{ inputs.cloudflare_project }}
          EMAIL_DEPLOYMENT_REQUESTED_AT: ${{ inputs.email_deployment_requested_at }}
          EMAIL_DEPLOYMENT_PROVIDER: ${{ inputs.email_deployment_provider }}
          TENANT_PORTAL_URL: https://${{ inputs.cloudflare_project }}.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${DYNAMAX_TENANT_PROVISIONER_SECRET}" ]] || { echo '::error::DYNAMAX_TENANT_PROVISIONER_SECRET is required.'; exit 1; }
          [[ "${EMAIL_DEPLOYMENT_PROVIDER}" == "brevo" || "${EMAIL_DEPLOYMENT_PROVIDER}" == "gmail" ]] || { echo '::error::Queued email provider is invalid.'; exit 1; }
          readiness="$(curl --fail-with-body --silent --show-error "${TENANT_PORTAL_URL}/api/email-provider-readiness")"
          jq -e \
            --arg provider "${EMAIL_DEPLOYMENT_PROVIDER}" \
            --arg requestedAt "${EMAIL_DEPLOYMENT_REQUESTED_AT}" \
            '.ok == true and .ready == true and .provider == $provider and .requestedAt == $requestedAt' \
            <<<"${readiness}" >/dev/null || { echo '::error::Deployed email provider is not ready or does not match the queued transition.'; exit 1; }
          payload="$(jq -nc \
            --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" \
            --arg projectId "${CLOUDFLARE_PROJECT}" \
            --arg requestedAt "${EMAIL_DEPLOYMENT_REQUESTED_AT}" \
            --arg provider "${EMAIL_DEPLOYMENT_PROVIDER}" \
            '{password:$password,action:"complete-managed-email-deployment",projectId:$projectId,requestedAt:$requestedAt,provider:$provider}')"
          curl --fail-with-body --silent --show-error \
            "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" \
            -H 'Content-Type: application/json' \
            --data "${payload}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### ${{ inputs.organisation_name }}'
            echo ''
            echo '- Organisation: `${{ inputs.organisation_id }}`'
            echo '- Edition: `${{ inputs.edition }}`'
            echo '- Firebase: `${{ env.FIREBASE_PROJECT_ID }}`'
            echo '- Cloudflare Pages: `${{ inputs.cloudflare_project }}`'
            echo '- Document storage: dedicated R2 bucket bound as `DYNAMAX_DOCUMENTS`'
            echo '- GitHub environment: `${{ inputs.github_environment }}`'
          } >> "${GITHUB_STEP_SUMMARY}"
