<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b4bc8">
  <title>Subscription receipt — Dynamax</title>
  <link rel="icon" href="images/Logo.png">
  <script src="js/preferences.js?v=20260726-biometric"></script>
  <link rel="stylesheet" href="css/style.css?v=20260903-hotel-tabs">
  <style>
    .receipt-shell{max-width:820px;margin:32px auto;padding:0 16px}.receipt-paper{background:#fff;border:1px solid #cdd9e6;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(16,36,62,.08)}.receipt-head{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:4px solid #0b7d70;padding-bottom:18px}.receipt-brand{display:flex;align-items:center;gap:14px}.receipt-brand img{width:58px;height:58px;object-fit:contain}.receipt-status{padding:8px 14px;border-radius:999px;background:#e4f7ef;color:#08705f;font-weight:800}.receipt-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d8e2ee;border-bottom:0;margin-top:24px}.receipt-field{padding:13px;border-bottom:1px solid #d8e2ee}.receipt-field:nth-child(odd){border-right:1px solid #d8e2ee}.receipt-field span{display:block;color:#60758c;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.receipt-field strong{display:block;margin-top:5px;color:#10243e;overflow-wrap:anywhere}.receipt-amount{margin:22px 0;padding:18px;border-radius:10px;background:#eef8f5;display:flex;justify-content:space-between;align-items:center;font-size:18px}.receipt-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.receipt-note{color:#60758c;font-size:13px;margin-top:24px}@media(max-width:620px){.receipt-head,.receipt-amount{align-items:flex-start;flex-direction:column}.receipt-grid{grid-template-columns:1fr}.receipt-field:nth-child(odd){border-right:0}}@media print{body{background:#fff}.receipt-shell{max-width:none;margin:0;padding:0}.receipt-paper{border:0;box-shadow:none;border-radius:0;padding:0}.receipt-actions{display:none}}
  </style>
</head>
<body class="auth-page">
  <main class="receipt-shell">
    <article class="receipt-paper" id="receiptPaper" aria-live="polite">
      <header class="receipt-head"><div class="receipt-brand"><img src="images/Logo.png" alt="Dynamax"><div><p class="eyebrow">Dynamax</p><h1>Subscription receipt</h1><p id="receiptMessage">Loading verified payment details…</p></div></div><span class="receipt-status" id="receiptStatus">VERIFYING</span></header>
      <div id="receiptContent"></div>
    </article>
  </main>
  <script src="js/subscription-receipt.js?v=20260918-subscription-receipts"></script>
</body>
</html>
