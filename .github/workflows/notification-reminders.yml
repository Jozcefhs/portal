name: Notification reminders

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYY-MM-DD processing date
        required: false
        type: string

concurrency:
  group: notification-reminders
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process fee reminders
        env:
          ENDPOINT: ${{ secrets.NOTIFICATION_SCHEDULER_URL }}
          SCHEDULER_SECRET: ${{ secrets.NOTIFICATION_SCHEDULER_SECRET }}
          PROCESS_DATE: ${{ inputs.date }}
        run: |
          test -n "$ENDPOINT"
          test -n "$SCHEDULER_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $SCHEDULER_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"today\":\"$PROCESS_DATE\",\"limit\":250}"
