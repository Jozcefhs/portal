name: Publish verified desktop 3.1.73 installer
on:
  push:
    branches: [codex/publish-desktop-3173]
    paths: [.github/workflows/publish-desktop-3173.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify installer and publish stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Jozcefhs/portal
        shell: bash
        run: |
          set -euo pipefail
          installer=Dynamax_Setup_v3.1.73.exe
          digest=fc3409528c6a705e2d0ec5ff096997389b602ad8feab4637f6afb9edf5c400b4
          for part in 1 2; do
            curl --fail --retry 3 --silent --show-error "https://2bb247da.destinychristianacademy.pages.dev/installer-$part.bin" >> "$installer" || exit 1
          done
          echo "$digest  $installer" | sha256sum -c -
          gh release view desktop-stable --json isDraft,name | jq -e '.isDraft == false and (.name | test("v3\\.1\\.7[23] "))'
          if ! gh release view desktop-stable --json assets | jq -e --arg name "$installer" '.assets | any(.name == $name)'; then
            gh release upload desktop-stable "$installer"
          fi
          gh release view desktop-stable --json assets | jq -e --arg name "$installer" --arg digest "sha256:$digest" '.assets | any(.name == $name and .digest == $digest and .size == 42778057)'
          mkdir verification
          gh release download desktop-stable --pattern "$installer" --dir verification
          (cd verification && echo "$digest  $installer" | sha256sum -c -)
          printf '%s\n' 'Manual payment confirmation recognises a signed-in staff member whose login name has changed.' '' '[Download Dynamax Desktop 3.1.73](https://github.com/Jozcefhs/portal/releases/download/desktop-stable/Dynamax_Setup_v3.1.73.exe)' '' "Installer SHA-256: $digest" > release-notes.md
          gh release edit desktop-stable --title 'Dynamax Desktop v3.1.73 - Stable Download' --notes-file release-notes.md
