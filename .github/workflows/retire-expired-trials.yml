name: Manage expired Dynamax subscriptions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview lifecycle changes without sending notices or deleting projects
        required: true
        default: true
        type: boolean
      maximum:
        description: Maximum tenant projects to retire in this run
        required: true
        default: '5'
        type: string
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: dynamax-subscription-lifecycle
  cancel-in-progress: false

jobs:
  retire:
    name: Remind, suspend and retire expired subscriptions
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TENANT_POOL_AUTOMATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPLY_CHANGES: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
      DYNAMAX_PLATFORM_URL: ${{ vars.DYNAMAX_PLATFORM_URL || 'https://dynamaxms.pages.dev' }}
      DYNAMAX_TENANT_PROVISIONER_SECRET: ${{ secrets.DYNAMAX_TENANT_PROVISIONER_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TENANT_RETIRE_MAXIMUM: ${{ inputs.maximum || '5' }}
      TENANT_RETIRE_RUNNER_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out portal source
        uses: actions/checkout@v4

      - name: Validate lifecycle configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DYNAMAX_TENANT_PROVISIONER_SECRET}" || { echo 'DYNAMAX_TENANT_PROVISIONER_SECRET is missing.' >&2; exit 1; }
          if [[ "${APPLY_CHANGES}" == "true" ]]; then
            test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing.' >&2; exit 1; }
            test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'CLOUDFLARE_API_TOKEN is missing.' >&2; exit 1; }
          fi

      - name: Process subscription lifecycle
        shell: bash
        run: |
          set -euo pipefail
          dry_run=true
          [[ "${APPLY_CHANGES}" == "true" ]] && dry_run=false
          payload="$(jq -nc --arg password "${DYNAMAX_TENANT_PROVISIONER_SECRET}" --argjson dry_run "${dry_run}" '{password:$password,action:"process-lifecycle",dryRun:$dry_run}')"
          curl --fail-with-body --silent --show-error "${DYNAMAX_PLATFORM_URL}/api/tenant-project-pool" \
            -H 'Content-Type: application/json' \
            --data "${payload}" | tee tenant-lifecycle-result.json

      - name: Authenticate to Google Cloud
        if: ${{ env.APPLY_CHANGES == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.DYNAMAX_PROVISION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.DYNAMAX_PROVISION_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: ${{ env.APPLY_CHANGES == 'true' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Permanently retire due tenant projects
        if: ${{ env.APPLY_CHANGES == 'true' }}
        env:
          TENANT_RETIRE_APPLY: 'true'
        run: node scripts/retire-tenant-projects.mjs

      - name: Upload lifecycle result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tenant-subscription-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tenant-lifecycle-result.json
            tenant-retirement-result.json
          if-no-files-found: warn
          retention-days: 30
