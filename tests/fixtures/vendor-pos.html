<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor POS fixture</title>
<link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/vendor-settlements.css"><style>body{padding:12px}#root{max-width:1540px;margin:auto;padding:16px;background:#fff;border:1px solid #d4e3ed;border-radius:12px}input,select{box-sizing:border-box}button{cursor:pointer}@media(max-width:680px){body{padding:6px}#root{padding:8px}}</style>
<main id="root"></main><script src="../../js/vendor-pos.js"></script><script>
let quantity=5,posted=false;
const options=new URLSearchParams(location.search);
const section=['tuckShop','restaurant','organizationStore'].includes(options.get('section'))?options.get('section'):'tuckShop';
const dense=options.get('dense')==='1';
DynamaxVendorPOS.mount(document.querySelector('#root'),async(action,body)=>{
 await new Promise(resolve=>setTimeout(resolve,80));
 if(action==='salesBootstrap')return {sellingEnabled:true,message:'LOCAL FIXTURE — no real payment or stock.',products:[
  {InventoryId:'stock-1',ItemCode:'WATER',ItemName:'Water',Category:'Drinks',Unit:'bottle',Price:100,Quantity:quantity},
  {InventoryId:'stock-2',ItemCode:'BREAD',ItemName:'Bread',Category:'Food',Unit:'loaf',Price:200,Quantity:10},
  ...(dense?Array.from({length:24},(_,i)=>({InventoryId:'sample-'+i,ItemCode:'SAMPLE-'+i,ItemName:'Sample product '+(i+1),Category:['Stationeries','Toiletries','Snacks'][i%3],Unit:'pcs',Price:200,Quantity:20+i})):[])]};
 if(action==='vendorWalletLookup')return {account:{AccountRef:'FIXTURE/001',DisplayName:'Fixture child'}};
 if(action==='previewVendorSale')return {Amount:body.Items.reduce((n,i)=>n+i.Quantity*(i.Reference==='stock-1'?100:200),0)};
 if(action.startsWith('record')){if(!posted){quantity-=body.Items[0].Quantity;posted=true;}return {message:'Fixture sale recorded.',sale:{SaleNo:'FIXTURE-RECEIPT',Amount:body.ExpectedAmount}};}
 throw new Error('Unexpected fixture action');
},section);
</script></html>
