name: Deploy church web app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-digc-suite-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  firestore-indexes:
    name: Verify church Firestore indexes
    uses: ./.github/workflows/deploy-firestore-indexes.yml
    with:
      firebase_project_id: ${{ vars.CHURCH_FIREBASE_PROJECT_ID }}
      workload_identity_provider: ${{ vars.CHURCH_GCP_WIF_PROVIDER }}
      service_account: ${{ vars.CHURCH_GCP_INDEX_SERVICE_ACCOUNT }}
      firebase_config: firebase.church.json

  deploy:
    name: Deploy digc-suite to Cloudflare Pages
    needs: firestore-indexes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: a5aa57ffa1fd00e4fd98e78ee7d32f01

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install function dependencies
        run: npm ci --ignore-scripts

      - name: Prepare production files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-deploy
          mkdir .pages-deploy
          cp -R css functions images js vendor .pages-deploy/
          cp _headers _routes.json .pages-deploy/
          cp ./*.html .pages-deploy/
          cp app-icon.svg manifest.webmanifest sw.js version.json .pages-deploy/

      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages-deploy --project-name=digc-suite --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
